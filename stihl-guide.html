<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stihl Chain &amp; Bar Compatibility Guide</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        min-height: 100vh;
        padding: 1rem;
      }
      @media (min-width: 600px) {
        body {
          padding: 2rem;
        }
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 600;
        color: #f5a623;
        margin-bottom: 0.25rem;
      }
      .subtitle {
        font-size: 0.85rem;
        color: #888;
        margin-bottom: 1.5rem;
      }
      .subtitle a {
        color: #f5a623;
        text-decoration: none;
      }
      .controls {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
        align-items: flex-end;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      .field label {
        font-size: 0.78rem;
        color: #aaa;
      }
      select {
        background: #252525;
        border: 1px solid #444;
        border-radius: 5px;
        color: #e0e0e0;
        padding: 0.5rem 0.6rem;
        font-size: 0.9rem;
        min-width: 200px;
        outline: none;
      }
      select:focus {
        border-color: #f5a623;
      }

      .panel {
        background: #252525;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 1.25rem;
        margin-bottom: 1rem;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .panel h2 {
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        margin-bottom: 0.75rem;
      }

      .size-header {
        font-size: 0.85rem;
        font-weight: 700;
        color: #f5a623;
        background: #1e1e1e !important;
        padding: 0.5rem 0.6rem;
        border-bottom: 2px solid #f5a623 !important;
      }

      .compat-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.75rem;
        table-layout: auto;
      }
      .compat-table th {
        text-align: left;
        padding: 0.3rem 0.5rem;
        background: #2e2e2e;
        color: #888;
        font-weight: 600;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        border-bottom: 1px solid #444;
        white-space: nowrap;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      .compat-table td {
        padding: 0.3rem 0.5rem;
        border-bottom: 1px solid #2a2a2a;
        white-space: nowrap;
        vertical-align: middle;
      }
      .compat-table tr:hover td {
        background: #2a2a2a;
      }
      .compat-table .bar-info {
        color: #ccc;
        font-weight: 500;
      }
      .compat-table .bar-pn {
        color: #e0e0e0;
        font-size: 0.7rem;
      }
      .compat-table .chain-cell {
        text-align: center;
        color: #888;
        font-size: 0.72rem;
      }
      .compat-table .chain-cell.has {
        color: #ccc;
      }
      .compat-table .chain-cell .code {
        display: block;
      }

      .rec {
        position: relative;
      }
      .rec::after {
        content: "\2605";
        color: #f5a623;
        font-size: 0.6rem;
        position: absolute;
        top: -2px;
        right: -1px;
      }

      .rec-row td {
        background: #1e2a1e !important;
      }
      .rec-row:hover td {
        background: #243a24 !important;
      }

      .legend {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
        font-size: 0.75rem;
        color: #888;
        margin-bottom: 1rem;
        align-items: center;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }
      .legend-star {
        color: #f5a623;
      }

      .sprocket-info {
        font-size: 0.8rem;
        color: #888;
        margin-top: 0.5rem;
      }
      .sprocket-info span {
        color: #ccc;
      }

      .empty-state {
        color: #555;
        text-align: center;
        padding: 3rem 1rem;
        font-size: 0.9rem;
      }

      /* View toggle */
      .view-toggle {
        display: flex;
        gap: 0;
        margin-bottom: 1.25rem;
        border: 1px solid #444;
        border-radius: 6px;
        overflow: hidden;
        width: fit-content;
      }
      .toggle-btn {
        background: #252525;
        border: none;
        color: #888;
        padding: 0.5rem 1.25rem;
        font-size: 0.85rem;
        cursor: pointer;
        font-weight: 500;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .toggle-btn:not(:last-child) {
        border-right: 1px solid #444;
      }
      .toggle-btn:hover {
        color: #ccc;
        background: #2e2e2e;
      }
      .toggle-btn.active {
        background: #f5a623;
        color: #1a1a1a;
        font-weight: 600;
      }

      /* Bar PN search */
      .search-field {
        position: relative;
      }
      .search-field input {
        background: #252525;
        border: 1px solid #444;
        border-radius: 5px;
        color: #e0e0e0;
        padding: 0.5rem 0.6rem;
        font-size: 0.9rem;
        min-width: 200px;
        outline: none;
        font-family: inherit;
        width: 100%;
      }
      .search-field input:focus {
        border-color: #f5a623;
      }
      .search-dropdown {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: #2a2a2a;
        border: 1px solid #444;
        border-top: none;
        border-radius: 0 0 5px 5px;
        max-height: 260px;
        overflow-y: auto;
        z-index: 10;
      }
      .search-dropdown.open {
        display: block;
      }
      .search-option {
        padding: 0.4rem 0.6rem;
        font-size: 0.85rem;
        color: #ccc;
        cursor: pointer;
      }
      .search-option:hover,
      .search-option.active {
        background: #383838;
        color: #f5a623;
      }
      .search-option .search-meta {
        color: #666;
        font-size: 0.7rem;
        margin-left: 0.5rem;
      }

      /* Bar results */
      .bar-result-card {
        background: #252525;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 1.25rem;
        margin-bottom: 1rem;
        overflow-x: auto;
      }
      .bar-specs {
        display: grid;
        grid-template-columns: 3.5rem 10rem 3.5rem 3.5rem 4rem 9rem auto;
        gap: 0.75rem;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }
      .bar-specs:hover {
        background: #2a2a2a;
        margin: -0.5rem;
        padding: 0.5rem;
        border-radius: 4px;
      }
      .bar-result-card.open .bar-specs {
        margin-bottom: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid #333;
      }
      @media (max-width: 700px) {
        .bar-specs {
          grid-template-columns: repeat(3, 1fr);
          gap: 0.5rem;
        }
      }
      .bar-toggle {
        display: flex;
        align-items: center;
        color: #555;
        font-size: 0.75rem;
        margin-left: auto;
        padding-left: 1rem;
        flex-shrink: 0;
      }
      .bar-toggle::after {
        content: "\25B6";
        font-size: 0.6rem;
        transition: transform 0.15s;
      }
      .bar-result-card.open .bar-toggle::after {
        transform: rotate(90deg);
      }
      .bar-detail {
        display: none;
      }
      .bar-result-card.open .bar-detail {
        display: block;
      }
      .bar-spec {
        display: flex;
        flex-direction: column;
      }
      .bar-spec-label {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #666;
      }
      .bar-spec-value {
        font-size: 0.95rem;
        color: #e0e0e0;
        font-weight: 500;
      }
      .bar-section-title {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        margin: 1rem 0 0.5rem 0;
      }
      .saw-list-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.78rem;
      }
      .saw-list-table th {
        text-align: left;
        padding: 0.3rem 0.5rem;
        background: #2e2e2e;
        color: #888;
        font-weight: 600;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        border-bottom: 1px solid #444;
      }
      .saw-list-table td {
        padding: 0.3rem 0.5rem;
        border-bottom: 1px solid #2a2a2a;
        color: #ccc;
      }
      .saw-list-table tr:hover td {
        background: #2a2a2a;
      }
      .saw-list {
        font-size: 0.82rem;
        color: #ccc;
        line-height: 1.6;
      }
      .saw-link {
        color: #f5a623;
        text-decoration: none;
        cursor: pointer;
      }
      .saw-link:hover {
        text-decoration: underline;
      }
      .copy-btn {
        background: none;
        border: 1px solid #444;
        border-radius: 3px;
        color: #888;
        font-size: 0.6rem;
        padding: 1px 4px;
        margin-left: 4px;
        cursor: pointer;
        vertical-align: middle;
        line-height: 1;
      }
      .copy-btn:hover {
        border-color: #f5a623;
        color: #f5a623;
      }
      .copy-btn.copied {
        border-color: #4a4;
        color: #4a4;
      }

      .bar-results-grid {
        display: grid;
        gap: 1rem;
      }

      .no-results {
        color: #555;
        font-size: 0.85rem;
        padding: 1rem 0;
      }
    </style>
  </head>
  <body>
    <h1>Stihl Chain &amp; Bar Compatibility Guide</h1>
    <p class="subtitle">
      Look up by chainsaw or by bar &nbsp;|&nbsp;
      <a href="index.html">Back to Chain Calculator</a>
    </p>

    <div class="view-toggle">
      <button
        class="toggle-btn active"
        data-view="saw"
        onclick="switchView('saw')"
      >
        By Chainsaw
      </button>
      <button class="toggle-btn" data-view="bar" onclick="switchView('bar')">
        By Bar
      </button>
    </div>

    <div id="saw-controls" class="controls">
      <div class="field">
        <label>Brand</label>
        <select id="brand-select" onchange="onBrandChange()">
          <option value="">Select brand...</option>
          <option value="stihl" selected>STIHL</option>
          <option value="stihl discontinued">STIHL (Discontinued)</option>
        </select>
      </div>
      <div class="field search-field">
        <label>Model</label>
        <input
          type="text"
          id="model-input"
          placeholder="Type to search..."
          oninput="onModelInput()"
          onfocus="
            this.select();
            onModelInput();
          "
          onkeydown="onModelKeydown(event)"
          autocomplete="off"
        />
        <div id="model-dropdown" class="search-dropdown"></div>
      </div>
    </div>

    <div id="bar-controls" class="controls" style="display: none">
      <div class="field">
        <label>Bar Size</label>
        <select id="bar-size-select" onchange="onBarFilterChange()">
          <option value="">All sizes...</option>
        </select>
      </div>
      <div class="field">
        <label>Bar Type</label>
        <select id="bar-type-select" onchange="onBarFilterChange()">
          <option value="">All types...</option>
        </select>
      </div>
      <div class="field">
        <label>Gauge</label>
        <select id="bar-gauge-select" onchange="onBarFilterChange()">
          <option value="">All gauges...</option>
        </select>
      </div>
      <div class="field">
        <label>Pitch</label>
        <select id="bar-pitch-select" onchange="onBarFilterChange()">
          <option value="">All pitches...</option>
        </select>
      </div>
      <div class="field search-field">
        <label>Part Number</label>
        <input
          type="text"
          id="bar-pn-input"
          placeholder="Search P/N..."
          oninput="onBarPNInput()"
          autocomplete="off"
        />
        <div id="bar-pn-dropdown" class="search-dropdown"></div>
      </div>
    </div>

    <div id="results">
      <p class="empty-state">
        Select your chainsaw model above to see compatible bars and chains.
      </p>
    </div>

    <script>
      // Data loaded from stihl-data.json at startup
      let CHAIN_TYPES = [];
      let CHAIN_LABELS = {};
      let MODELS = {};
      let CANNON = null;
      let OREGON = null;
      let OREGON_CHAINS = null;

      // ─── Helpers ────────────────────────────────────────────────────────────────────
      function escAttr(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function copyPN(pn, btn) {
        navigator.clipboard.writeText(pn).then(() => {
          btn.textContent = "✓";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.textContent = "copy";
            btn.classList.remove("copied");
          }, 1200);
        });
      }

      // ─── Bar Index (computed from MODELS after data loads) ────────────────────────
      // Key = bar PN, value = { barType, size, pitch, gauge, dl, chains, saws: [{brand, model, rec}] }
      let BAR_INDEX = {};
      let ALL_BAR_PNS = [];

      function buildBarIndex() {
        BAR_INDEX = {};

        // ── Stihl bars (from MODELS) ─────────────────────────────────────────
        for (const brand of Object.keys(MODELS)) {
          for (const model of Object.keys(MODELS[brand])) {
            const data = MODELS[brand][model];
            for (const row of data.rows) {
              const pns = row.barPN.split("\n");
              for (const pn of pns) {
                const key = pn.trim();
                if (!BAR_INDEX[key]) {
                  BAR_INDEX[key] = {
                    pn: key,
                    brand: brand,
                    barType: row.barType,
                    size: row.size,
                    pitch: row.pitch,
                    gauge: row.gauge,
                    dl: row.dl,
                    chains: { ...row.chains },
                    saws: [],
                  };
                } else {
                  for (const [ct, cv] of Object.entries(row.chains)) {
                    if (!BAR_INDEX[key].chains[ct])
                      BAR_INDEX[key].chains[ct] = cv;
                  }
                }
                const already = BAR_INDEX[key].saws.find(
                  (s) => s.brand === brand && s.model === model,
                );
                if (!already) {
                  BAR_INDEX[key].saws.push({ brand, model, rec: row.rec });
                }
              }
            }
          }
        }

        // ── Cannon bars ──────────────────────────────────────────────────────
        if (CANNON) {
          // Decode a Cannon PN into bar attributes
          // Formats:
          //   CSB-{mount}-{size}-{gauge}-{pitch}          e.g. CSB-S1-18-63-3
          //   CSB-{mount}-{size}-{gauge}-DL-{pitch}       e.g. CSB-S1-20-50-DL-2
          //   CSM-{mount}-{size}-{gauge}-{pitch}          e.g. CSM-C1-16-50-2
          //   CCA/CCT/CCQ/CCD-{mount}-{size}-{gauge}      e.g. CCQ-S1-16-50
          const CANNON_GAUGE = {
            43: ".043",
            50: ".050",
            58: ".058",
            63: ".063",
          };
          const CANNON_PITCH = {
            2: '.325"',
            3: '3/8"',
            4: '.404"',
            "3LM": '3/8" P',
            H: null,
          };
          const CANNON_TYPE = {
            CSB: "Regular",
            "CSB-DL": "Lightweight",
            CSM: "Regular (Narrow Gauge)",
            CCA: "Carving (Arbor Tip)",
            CCT: "Carving (Toonie Tip)",
            CCQ: "Carving (Quarter Tip)",
            CCD: "Carving (Dime Tip)",
            CPP: "Pruning",
          };

          // Build mount → saws map once
          const mountSaws = { C1: [], S1: [], S2: [] };
          for (const brand of Object.keys(MODELS)) {
            for (const model of Object.keys(MODELS[brand])) {
              const mt = MODELS[brand][model].cannonMount;
              if (mt && mountSaws[mt]) {
                mountSaws[mt].push({ brand, model, rec: false });
              }
            }
          }

          for (const [mount, entries] of Object.entries(CANNON.bars)) {
            for (const entry of entries) {
              const pn = entry.pn;
              const dl = entry.dl ?? null;
              const parts = pn.split("-");
              const isDL = parts.includes("DL");
              const base = parts[0]; // CSB, CSM, CCA, etc.
              const type = isDL ? "CSB-DL" : base;
              // Detect compound size: if parts[3] is a plain number (not a gauge code),
              // it's the second half of a size like "24-25" or "41-42"
              const GAUGE_CODES = new Set(["43", "50", "58", "63"]);
              const sizeIsCompound =
                !GAUGE_CODES.has(parts[3]) && /^\d+$/.test(parts[3]);
              const sizeOffset = sizeIsCompound ? 1 : 0;
              let sz, gaugeCode, pitchCode;
              if (isDL) {
                sz = sizeIsCompound ? parts[2] + "-" + parts[3] : parts[2];
                gaugeCode = parts[3 + sizeOffset];
                pitchCode = parts[5 + sizeOffset];
              } else {
                sz = sizeIsCompound ? parts[2] + "-" + parts[3] : parts[2];
                gaugeCode = parts[3 + sizeOffset];
                pitchCode = parts[4 + sizeOffset] || null;
              }
              const pitch = pitchCode ? CANNON_PITCH[pitchCode] : null;
              if (!pitch) continue; // skip hard nose — no pitch to work with
              const gauge = CANNON_GAUGE[gaugeCode] || "." + gaugeCode;
              const size = sz.replace("-", "/") + '"'; // "16\"", "24/25\"", "41/42\""
              BAR_INDEX[pn] = {
                pn,
                brand: "cannon",
                barType: CANNON_TYPE[type] || type,
                size,
                pitch,
                gauge,
                dl,
                chains: {},
                saws: mountSaws[mount] || [],
              };
            }
          }
        }

        // ── Oregon bars ──────────────────────────────────────────────────────
        if (OREGON) {
          // Build mount → saws map (same logic as Cannon)
          const oregonMountSaws = { C1: [], S1: [], S2: [] };
          for (const brand of Object.keys(MODELS)) {
            for (const model of Object.keys(MODELS[brand])) {
              const mt = MODELS[brand][model].cannonMount; // Oregon uses same mount codes
              if (mt && oregonMountSaws[mt]) {
                oregonMountSaws[mt].push({ brand, model, rec: false });
              }
            }
          }
          for (const [mount, bars] of Object.entries(OREGON.bars)) {
            for (const bar of bars) {
              BAR_INDEX[bar.pn] = {
                pn: bar.pn,
                brand: "oregon",
                barType: bar.barType,
                size: bar.size,
                pitch: bar.pitch,
                gauge: bar.gauge,
                dl: bar.dl,
                chains: {},
                saws: oregonMountSaws[mount] || [],
              };
            }
          }
        }

        ALL_BAR_PNS = Object.keys(BAR_INDEX).sort();
      }

      // ─── UI ────────────────────────────────────────────────────────────────────────

      let currentView = "saw"; // "saw" or "bar"

      function switchView(view) {
        currentView = view;
        document.querySelectorAll(".toggle-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.view === view);
        });
        document.getElementById("saw-controls").style.display =
          view === "saw" ? "flex" : "none";
        document.getElementById("bar-controls").style.display =
          view === "bar" ? "flex" : "none";

        if (view === "saw") {
          onModelChange();
        } else {
          populateBarFilters();
          onBarFilterChange();
        }
      }

      // ─── Saw View ──────────────────────────────────────────────────────────────────

      let allModels = []; // [{brand, model}] — populated on brand change
      let modelDropdownIdx = -1; // keyboard nav index

      function onBrandChange() {
        const brand = document.getElementById("brand-select").value;
        const input = document.getElementById("model-input");
        input.value = "";
        allModels = [];
        if (brand && MODELS[brand]) {
          allModels = Object.keys(MODELS[brand])
            .sort((a, b) => {
              const num = (s) =>
                parseFloat(s.replace(/[^0-9.]/g, " ").trim()) || 0;
              return num(a) - num(b);
            })
            .map((m) => ({ brand, model: m }));
        }
        closeModelDropdown();
        document.getElementById("results").innerHTML =
          '<p class="empty-state">Select your chainsaw model above to see compatible bars and chains.</p>';
      }

      function onModelInput() {
        const input = document.getElementById("model-input");
        const dropdown = document.getElementById("model-dropdown");
        const query = input.value.trim().toLowerCase();
        modelDropdownIdx = -1;

        // Filter models — show all if input is empty (on focus)
        const matches = allModels.filter(
          (m) => !query || m.model.toLowerCase().includes(query),
        );

        if (matches.length === 0) {
          dropdown.innerHTML =
            '<div class="search-option" style="color:#555;cursor:default;">No matches</div>';
          dropdown.classList.add("open");
          return;
        }

        dropdown.innerHTML = matches
          .map(
            (m, i) =>
              `<div class="search-option" data-idx="${i}" onclick="selectModel('${escAttr(m.brand)}','${escAttr(m.model)}')">${m.model}</div>`,
          )
          .join("");
        dropdown.classList.add("open");
      }

      function onModelKeydown(e) {
        const dropdown = document.getElementById("model-dropdown");
        const opts = dropdown.querySelectorAll(
          ".search-option:not([style*='cursor:default'])",
        );
        if (!opts.length) return;

        if (e.key === "ArrowDown") {
          e.preventDefault();
          modelDropdownIdx = Math.min(modelDropdownIdx + 1, opts.length - 1);
          opts.forEach((o, i) =>
            o.classList.toggle("active", i === modelDropdownIdx),
          );
          opts[modelDropdownIdx].scrollIntoView({ block: "nearest" });
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          modelDropdownIdx = Math.max(modelDropdownIdx - 1, 0);
          opts.forEach((o, i) =>
            o.classList.toggle("active", i === modelDropdownIdx),
          );
          opts[modelDropdownIdx].scrollIntoView({ block: "nearest" });
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (modelDropdownIdx >= 0 && opts[modelDropdownIdx]) {
            opts[modelDropdownIdx].click();
          } else if (opts.length === 1) {
            opts[0].click();
          }
        } else if (e.key === "Escape") {
          closeModelDropdown();
        }
      }

      function selectModel(brand, model) {
        document.getElementById("model-input").value = model;
        closeModelDropdown();
        onModelChange();
      }

      function closeModelDropdown() {
        document.getElementById("model-dropdown").classList.remove("open");
        modelDropdownIdx = -1;
      }

      function onModelChange() {
        const brand = document.getElementById("brand-select").value;
        const model = document.getElementById("model-input").value.trim();
        if (!brand || !model || !MODELS[brand] || !MODELS[brand][model]) {
          document.getElementById("results").innerHTML =
            '<p class="empty-state">Select your chainsaw model above to see compatible bars and chains.</p>';
          if (currentView === "saw")
            history.replaceState(null, "", location.pathname);
          return;
        }
        if (currentView === "saw") {
          history.replaceState(
            null,
            "",
            `#saw/${encodeURIComponent(brand)}/${encodeURIComponent(model)}`,
          );
        }
        renderModel(model, MODELS[brand][model]);
      }

      function renderModel(name, data) {
        const container = document.getElementById("results");

        // P-prefix and R-prefix chains share the same display label (e.g. PM3/RM3,
        // PS3/RS3, PD3/RD3, PM/RM, PS/RS). Merge them into a single column keyed
        // by the R-prefix code (or P-prefix if no R equivalent exists).
        const PICCO_MERGE = {
          PM3: "RM3",
          PS3: "RS3",
          PD3: "RD3",
          PM: "RM",
          PS: "RS",
        };

        // Build deduplicated column list in CHAIN_TYPES order
        const usedTypeSet = new Set();
        for (const t of CHAIN_TYPES) {
          if (data.rows.some((r) => r.chains[t])) {
            // Map P-prefix to its R-prefix equivalent if one exists
            usedTypeSet.add(PICCO_MERGE[t] || t);
          }
        }
        const usedTypes = CHAIN_TYPES.filter((t) => usedTypeSet.has(t));

        // Helper: get chain value for a column, checking both P and R codes
        const R_TO_P = {
          RM3: "PM3",
          RS3: "PS3",
          RD3: "PD3",
          RM: "PM",
          RS: "PS",
        };
        function chainVal(row, col) {
          return (
            row.chains[col] ||
            (R_TO_P[col] ? row.chains[R_TO_P[col]] : null) ||
            null
          );
        }

        // Oregon chain PN lookup: "{gaugeCode} {chainType}" + DL → Oregon PN
        // e.g. "33 RM3" + dl=60 → "73LPX060G"
        function getOregonChainPN(chainDesig) {
          if (!OREGON_CHAINS || !chainDesig) return null;
          const m = chainDesig.match(/^(\d+)\s+([A-Z0-9]+)$/);
          if (!m) return null;
          const [, gaugeCode, chainType] = m;
          const key = gaugeCode + "_" + chainType;
          // Check special cases first
          const sc = OREGON_CHAINS.specialCases;
          if (sc && key in sc) {
            const series = sc[key];
            if (!series) return null;
            return series;
          }
          const numPrefix = OREGON_CHAINS.gaugeToSeries[gaugeCode];
          if (!numPrefix) return null;
          const suffix = OREGON_CHAINS.typeToSuffix[chainType];
          if (!suffix) return null;
          return numPrefix + suffix;
        }

        // Group rows by size, sorted numerically
        const PITCH_ORDER = [
          '1/4" P',
          '1/4"',
          '.325" P',
          '.325"',
          '3/8" P',
          '3/8"',
          '.404"',
        ];
        const sizeMap = {};
        for (const row of data.rows) {
          if (!sizeMap[row.size]) sizeMap[row.size] = [];
          sizeMap[row.size].push(row);
        }
        // Sort rows within each size: barType order, then pitch order, then gauge ascending
        const BAR_TYPE_ORDER = [
          "Fixed",
          "Regular",
          "Lightweight",
          "Hard Nose",
          "Carving",
          "Regular (Narrow Gauge)",
          "Lightweight (Narrow Gauge)",
        ];
        for (const rows of Object.values(sizeMap)) {
          rows.sort((a, b) => {
            const it =
              BAR_TYPE_ORDER.indexOf(a.barType) -
              BAR_TYPE_ORDER.indexOf(b.barType);
            if (it !== 0) return it;
            const ip =
              PITCH_ORDER.indexOf(a.pitch) - PITCH_ORDER.indexOf(b.pitch);
            if (ip !== 0) return ip;
            return a.gauge.localeCompare(b.gauge);
          });
        }
        const sizes = Object.keys(sizeMap).sort(
          (a, b) => parseFloat(a) - parseFloat(b),
        );

        // ── Build Cannon lookup: "size|gaugeCode|pitchCode" → [partNumbers] ──────
        // Pitch: .325"→2, 3/8"→3, 3/8" P→3, .404"→4
        // Gauge: .043→43, .050→50, .058→58, .063→63
        const STIHL_PITCH_TO_CANNON = {
          '.325"': "2",
          '3/8"': "3",
          '3/8" P': "3",
          '.404"': "4",
        };
        const STIHL_GAUGE_TO_CANNON = {
          ".043": "43",
          ".050": "50",
          ".058": "58",
          ".063": "63",
        };
        const cannonLookup = {}; // "16|50|3" → ["CSB-S1-16-50-3", ...]
        if (data.cannonMount && CANNON && CANNON.bars[data.cannonMount]) {
          for (const entry of CANNON.bars[data.cannonMount]) {
            const pn = entry.pn;
            const parts = pn.split("-");
            const isDL = parts.includes("DL");
            // Detect compound size: "24-25" or "41-42" — parts[3] is a number, not a gauge
            const GAUGE_CODES = new Set(["43", "50", "58", "63"]);
            const sizeIsCompound =
              !GAUGE_CODES.has(parts[3]) && /^\d+$/.test(parts[3]);
            const off = sizeIsCompound ? 1 : 0;
            const szRaw = sizeIsCompound ? parts[2] + "-" + parts[3] : parts[2];
            const sz = szRaw.replace("-", "/") + '"'; // "16\"", "24/25\"", "41/42\""
            const gauge = parts[3 + off];
            const pitch = isDL ? parts[5 + off] : parts[4 + off];
            if (!pitch || pitch === "H") continue;
            const key = `${sz}|${gauge}|${pitch}`;
            if (!cannonLookup[key]) cannonLookup[key] = [];
            cannonLookup[key].push(pn);
          }
        }
        const hasCannon = Object.keys(cannonLookup).length > 0;

        // Oregon lookup: size|pitch|gauge|barType → [pns]
        const oregonLookup = {};
        if (data.cannonMount && OREGON && OREGON.bars[data.cannonMount]) {
          for (const bar of OREGON.bars[data.cannonMount]) {
            const key = `${bar.size}|${bar.pitch}|${bar.gauge}|${bar.barType}`;
            if (!oregonLookup[key]) oregonLookup[key] = [];
            oregonLookup[key].push(bar.pn);
          }
        }
        const hasOregon = Object.keys(oregonLookup).length > 0;

        // Cannon only makes replaceable-nose bars — no equivalent for fixed nose types.
        // Cannon only makes replaceable-nose bars — no equivalent for fixed/hard nose types.
        // Since we've merged Fixed+Replaceable into "Regular", Cannon CSB maps to Regular.
        // The only no-match types are Hard Nose and Narrow Gauge (SuperMini has no Cannon match for fixed).
        const CANNON_NO_MATCH = new Set([
          "Hard Nose",
          "Fixed",
          "Regular (Narrow Gauge)",
          "Lightweight (Narrow Gauge)",
        ]);

        function cannonForRow(row) {
          if (CANNON_NO_MATCH.has(row.barType)) return [];
          const sz = row.size; // e.g. "16\"", "24/25\"" — already normalized in data
          const gauge = STIHL_GAUGE_TO_CANNON[row.gauge];
          const pitch = STIHL_PITCH_TO_CANNON[row.pitch];
          if (!gauge || !pitch) return [];
          const all = cannonLookup[`${sz}|${gauge}|${pitch}`] || [];
          // DuraLite maps to Lightweight rows only; standard CSB maps to Regular.
          const isDLRow = row.barType === "Lightweight";
          return all.filter((p) =>
            isDLRow ? p.includes("-DL-") : !p.includes("-DL-"),
          );
        }

        // Oregon: no equivalent for Hard Nose, Carving, or Narrow Gauge
        const OREGON_NO_MATCH = new Set([
          "Carving",
          "Regular (Narrow Gauge)",
          "Lightweight (Narrow Gauge)",
        ]);

        function oregonForRow(row) {
          if (OREGON_NO_MATCH.has(row.barType)) return [];
          // Oregon barType must match the row's barType
          // "Regular (Narrow Gauge)" rows → Oregon "Regular (Narrow Gauge)"
          // "Lightweight (Narrow Gauge)" rows → Oregon "Lightweight (Narrow Gauge)" (none exist yet)
          // "Regular" rows → Oregon "Regular"
          // "Lightweight" rows → Oregon "Lightweight"
          const key = `${row.size}|${row.pitch}|${row.gauge}|${row.barType}`;
          return oregonLookup[key] || [];
        }

        let html = "";
        html += `<div class="legend">`;
        html += `<span style="color:#aaa;font-weight:600;">${name}</span>`;
        html += `<span class="legend-item"><span class="legend-star">&#9733;</span> Stihl recommended</span>`;
        if (hasCannon)
          html += `<span class="legend-item">&#9670; Cannon equivalent</span>`;
        if (hasOregon)
          html += `<span class="legend-item">&#9670; Oregon equivalent</span>`;
        html += `</div>`;

        // Sprocket table
        const sprs = data.sprockets || (data.sprocket ? [data.sprocket] : []);
        if (sprs.length) {
          html += `<div class="panel"><h2>Sprocket Options</h2>`;
          html += `<table class="compat-table"><thead><tr><th>Pitch</th><th>Teeth</th><th>Spur Sprocket</th><th>Rim Sprocket</th><th>Rim &amp; Drum Kit</th></tr></thead><tbody>`;
          for (const s of sprs) {
            html += `<tr>`;
            html += `<td class="bar-info">${s.pitch}</td>`;
            html += `<td class="bar-info">${s.teeth}</td>`;
            html += `<td class="bar-pn">${s.spur ? s.spur + ` <button class="copy-btn" onclick="copyPN('${s.spur}',this)">copy</button>` : "–"}</td>`;
            html += `<td class="bar-pn">${s.rim ? s.rim + ` <button class="copy-btn" onclick="copyPN('${s.rim}',this)">copy</button>` : "–"}</td>`;
            html += `<td class="bar-pn">${s.rimKit ? s.rimKit + ` <button class="copy-btn" onclick="copyPN('${s.rimKit}',this)">copy</button>` : "–"}</td>`;
            html += `</tr>`;
          }
          html += `</tbody></table></div>`;
        }

        const totalCols = 5 + usedTypes.length;

        html += `<div class="panel">`;
        html += `<table class="compat-table"><tbody>`;

        for (const size of sizes) {
          const rows = sizeMap[size];

          // Header row with size as first column
          html += `<tr>`;
          html += `<th class="size-header" style="text-align:left;">${size}</th>`;
          html += `<th class="size-header">Pitch</th><th class="size-header">Gauge</th><th class="size-header">DL</th><th class="size-header">Stihl</th>`;
          if (hasCannon) html += `<th class="size-header">Cannon</th>`;
          if (hasOregon) html += `<th class="size-header">Oregon</th>`;
          for (const t of usedTypes) {
            html += `<th class="size-header chain-cell">${CHAIN_LABELS[t].replace("\n", "<br>")}</th>`;
          }
          html += `</tr>`;

          // Calculate rowspans: barType spans all its rows, pitch spans rows within same barType+pitch
          const typeGroups = [];
          for (let i = 0; i < rows.length; i++) {
            const t = rows[i].barType;
            if (
              typeGroups.length &&
              typeGroups[typeGroups.length - 1].key === t
            ) {
              typeGroups[typeGroups.length - 1].count++;
            } else {
              typeGroups.push({ key: t, start: i, count: 1 });
            }
          }
          const typeSpanAt = {};
          for (const g of typeGroups) typeSpanAt[g.start] = g.count;

          const pitchGroups = [];
          for (let i = 0; i < rows.length; i++) {
            const k = rows[i].barType + "|" + rows[i].pitch;
            if (
              pitchGroups.length &&
              pitchGroups[pitchGroups.length - 1].key === k
            ) {
              pitchGroups[pitchGroups.length - 1].count++;
            } else {
              pitchGroups.push({ key: k, start: i, count: 1 });
            }
          }
          const pitchSpanAt = {};
          for (const g of pitchGroups) pitchSpanAt[g.start] = g.count;

          for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            const barPNs = row.barPN.split("\n");
            html += `<tr>`;
            if (typeSpanAt[i] !== undefined) {
              const span =
                typeSpanAt[i] > 1 ? ` rowspan="${typeSpanAt[i]}"` : "";
              html += `<td class="bar-info"${span} style="vertical-align:middle;border-right:1px solid #333;">${row.barType}</td>`;
            }
            if (pitchSpanAt[i] !== undefined) {
              const span =
                pitchSpanAt[i] > 1 ? ` rowspan="${pitchSpanAt[i]}"` : "";
              html += `<td class="bar-info"${span} style="vertical-align:middle;">${row.pitch}</td>`;
            }
            html += `<td class="bar-info">${row.gauge}</td>`;
            html += `<td class="bar-info">${row.dl}</td>`;
            const pnLinks = barPNs
              .map((pn) => {
                const p = pn.trim();
                if (!p) return null;
                return `<a class="saw-link" onclick="jumpToBar('${p}')">${p}</a><button class="copy-btn" onclick="event.stopPropagation();copyPN('${p}',this)">copy</button>`;
              })
              .filter(Boolean)
              .join("<br>");
            html += `<td class="bar-pn">${pnLinks || "–"}${row.rec ? ' <span style="color:#f5a623">&#9733;</span>' : ""}</td>`;
            if (hasCannon) {
              const cPNs = cannonForRow(row);
              if (cPNs.length) {
                const cLinks = cPNs
                  .map((p) => {
                    const cBar = BAR_INDEX[p];
                    const cDL = cBar ? cBar.dl : null;
                    const dlMismatch =
                      cDL != null && row.dl != null && cDL !== row.dl;
                    const dlNote = dlMismatch
                      ? ` <span style="color:#e55;" title="Drive links differ: Stihl=${row.dl}, Cannon=${cDL}">⚠ ${cDL} DL</span>`
                      : "";
                    return `<a class="saw-link" onclick="jumpToBar('${p}')">${p}</a><button class="copy-btn" onclick="event.stopPropagation();copyPN('${p}',this)">copy</button>${dlNote}`;
                  })
                  .join("<br>");
                html += `<td class="bar-pn">${cLinks}</td>`;
              } else {
                html += `<td class="bar-info">–</td>`;
              }
            }
            if (hasOregon) {
              const oPNs = oregonForRow(row);
              if (oPNs.length) {
                const oLinks = oPNs
                  .map((p) => {
                    const oBar = BAR_INDEX[p];
                    const oDL = oBar ? oBar.dl : null;
                    const dlMismatch =
                      oDL != null && row.dl != null && oDL !== row.dl;
                    const dlNote = dlMismatch
                      ? ` <span style="color:#e55;" title="Drive links differ: Stihl=${row.dl}, Oregon=${oDL}">⚠ ${oDL} DL</span>`
                      : "";
                    return `<a class="saw-link" onclick="jumpToBar('${p}')">${p}</a><button class="copy-btn" onclick="event.stopPropagation();copyPN('${p}',this)">copy</button>${dlNote}`;
                  })
                  .join("<br>");
                html += `<td class="bar-pn">${oLinks}</td>`;
              } else {
                html += `<td class="bar-info">–</td>`;
              }
            }
            for (const t of usedTypes) {
              const c = chainVal(row, t);
              const oregonPN = c ? getOregonChainPN(c) : null;
              const oregonNote = oregonPN
                ? `<br><span style="color:#aaa;font-size:.8em;">${oregonPN} <button class="copy-btn" style="font-size:.75em;" onclick="event.stopPropagation();copyPN('${oregonPN}',this)">copy</button></span>`
                : "";
              html += `<td class="chain-cell ${c ? "has" : ""}">${c || "–"}${oregonNote}</td>`;
            }
            html += `</tr>`;
          }
        }

        html += `</tbody></table>`;
        html += `</div>`;

        container.innerHTML = html;
      }

      // ─── Bar View ──────────────────────────────────────────────────────────────────

      function populateBarFilters() {
        const sizeSel = document.getElementById("bar-size-select");
        const typeSel = document.getElementById("bar-type-select");
        const gaugeSel = document.getElementById("bar-gauge-select");
        const pitchSel = document.getElementById("bar-pitch-select");

        const sizes = [...new Set(Object.values(BAR_INDEX).map((b) => b.size))];
        const types = [
          ...new Set(Object.values(BAR_INDEX).map((b) => b.barType)),
        ];
        const gauges = [
          ...new Set(Object.values(BAR_INDEX).map((b) => b.gauge)),
        ];
        const pitches = [
          ...new Set(Object.values(BAR_INDEX).map((b) => b.pitch)),
        ];

        // Sort sizes numerically
        sizes.sort((a, b) => parseFloat(a) - parseFloat(b));
        // Sort bar types so Lightweight variants appear immediately after their base type
        types.sort((a, b) => {
          const ORDER = [
            "Fixed",
            "Regular",
            "Lightweight",
            "Hard Nose",
            "Carving",
            "Regular (Narrow Gauge)",
            "Lightweight (Narrow Gauge)",
          ];
          const ia = ORDER.indexOf(a),
            ib = ORDER.indexOf(b);
          if (ia >= 0 && ib >= 0) return ia - ib;
          if (ia >= 0) return -1;
          if (ib >= 0) return 1;
          return a.localeCompare(b);
        });
        gauges.sort();
        const PITCH_ORDER = [
          '1/4" P',
          '1/4"',
          '.325" P',
          '.325"',
          '3/8" P',
          '3/8"',
          '.404"',
        ];
        pitches.sort((a, b) => {
          const ia = PITCH_ORDER.indexOf(a),
            ib = PITCH_ORDER.indexOf(b);
          if (ia >= 0 && ib >= 0) return ia - ib;
          if (ia >= 0) return -1;
          if (ib >= 0) return 1;
          return a.localeCompare(b);
        });

        function fill(sel, opts) {
          const val = sel.value;
          const label = sel.options[0].text;
          sel.innerHTML = `<option value="">${label}</option>`;
          for (const o of opts)
            sel.innerHTML += `<option value="${escAttr(o)}">${o}</option>`;
          if (opts.includes(val)) sel.value = val;
        }

        fill(sizeSel, sizes);
        fill(typeSel, types);
        fill(gaugeSel, gauges);
        fill(pitchSel, pitches);
      }

      function getFilteredBars() {
        const size = document.getElementById("bar-size-select").value;
        const type = document.getElementById("bar-type-select").value;
        const gauge = document.getElementById("bar-gauge-select").value;
        const pitch = document.getElementById("bar-pitch-select").value;

        return Object.values(BAR_INDEX).filter((b) => {
          if (size && b.size !== size) return false;
          if (type && b.barType !== type) return false;
          if (gauge && b.gauge !== gauge) return false;
          if (pitch && b.pitch !== pitch) return false;
          return true;
        });
      }

      function onBarFilterChange() {
        // Clear PN input when filters change
        document.getElementById("bar-pn-input").value = "";
        closePNDropdown();

        const bars = getFilteredBars();
        updateBarFilterOptions(bars);
        renderBarResults(bars);
        updateBarHash();
      }

      function updateBarFilterOptions(matchingBars) {
        // Update each filter to only show options that exist in the current result set,
        // but preserve the user's current selections
        const sizeSel = document.getElementById("bar-size-select");
        const typeSel = document.getElementById("bar-type-select");
        const gaugeSel = document.getElementById("bar-gauge-select");
        const pitchSel = document.getElementById("bar-pitch-select");

        // For each filter, determine available options by relaxing just that filter
        function optionsFor(field) {
          const size = sizeSel.value;
          const type = typeSel.value;
          const gauge = gaugeSel.value;
          const pitch = pitchSel.value;
          const vals = new Set();
          for (const b of Object.values(BAR_INDEX)) {
            if (field !== "size" && size && b.size !== size) continue;
            if (field !== "type" && type && b.barType !== type) continue;
            if (field !== "gauge" && gauge && b.gauge !== gauge) continue;
            if (field !== "pitch" && pitch && b.pitch !== pitch) continue;
            vals.add(b[field === "type" ? "barType" : field]);
          }
          return vals;
        }

        const PITCH_ORDER_BAR = [
          '1/4" P',
          '1/4"',
          '.325" P',
          '.325"',
          '3/8" P',
          '3/8"',
          '.404"',
        ];
        function updateOpts(sel, opts, sort) {
          const val = sel.value;
          const label = sel.options[0].text;
          const sorted = [...opts];
          if (sort === "num")
            sorted.sort((a, b) => parseFloat(a) - parseFloat(b));
          else if (sort === "pitch")
            sorted.sort((a, b) => {
              const ia = PITCH_ORDER_BAR.indexOf(a),
                ib = PITCH_ORDER_BAR.indexOf(b);
              if (ia >= 0 && ib >= 0) return ia - ib;
              if (ia >= 0) return -1;
              if (ib >= 0) return 1;
              return a.localeCompare(b);
            });
          else sorted.sort();
          sel.innerHTML = `<option value="">${label}</option>`;
          for (const o of sorted)
            sel.innerHTML += `<option value="${escAttr(o)}">${o}</option>`;
          if (opts.has(val)) sel.value = val;
          else sel.value = "";
        }

        updateOpts(sizeSel, optionsFor("size"), "num");
        updateOpts(typeSel, optionsFor("type"), "str");
        updateOpts(gaugeSel, optionsFor("gauge"), "str");
        updateOpts(pitchSel, optionsFor("pitch"), "pitch");
      }

      function onBarPNInput() {
        const input = document.getElementById("bar-pn-input");
        const dropdown = document.getElementById("bar-pn-dropdown");
        const query = input.value.trim().replace(/\s+/g, "");

        if (query.length < 2) {
          closePNDropdown();
          return;
        }

        // Search — match anywhere in the PN (ignoring spaces)
        const matches = ALL_BAR_PNS.filter((pn) =>
          pn.replace(/\s+/g, "").includes(query),
        ).slice(0, 15);

        if (matches.length === 0) {
          dropdown.innerHTML =
            '<div class="search-option" style="color:#555;cursor:default;">No matches</div>';
          dropdown.classList.add("open");
          return;
        }

        dropdown.innerHTML = matches
          .map((pn) => {
            const b = BAR_INDEX[pn];
            return `<div class="search-option" onclick="selectBarPN('${pn}')">${pn}<span class="search-meta">${b.size} ${b.barType} ${b.pitch} ${b.gauge}</span></div>`;
          })
          .join("");
        dropdown.classList.add("open");
      }

      function selectBarPN(pn) {
        document.getElementById("bar-pn-input").value = pn;
        closePNDropdown();

        // Reset filters
        document.getElementById("bar-size-select").value = "";
        document.getElementById("bar-type-select").value = "";
        document.getElementById("bar-gauge-select").value = "";
        document.getElementById("bar-pitch-select").value = "";

        const bar = BAR_INDEX[pn];
        if (bar) {
          renderBarResults([bar]);
          history.replaceState(null, "", `#bar/pn/${encodeURIComponent(pn)}`);
        }
      }

      function closePNDropdown() {
        document.getElementById("bar-pn-dropdown").classList.remove("open");
      }

      // Close dropdowns when clicking outside
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".search-field")) {
          closePNDropdown();
          closeModelDropdown();
        } else {
          // If clicking inside a search-field, close the OTHER dropdowns
          if (
            !e.target.closest("#model-input") &&
            !e.target.closest("#model-dropdown")
          )
            closeModelDropdown();
          if (
            !e.target.closest("#bar-pn-input") &&
            !e.target.closest("#bar-pn-dropdown")
          )
            closePNDropdown();
        }
      });

      function updateBarHash() {
        const size = document.getElementById("bar-size-select").value;
        const type = document.getElementById("bar-type-select").value;
        const gauge = document.getElementById("bar-gauge-select").value;
        const pitch = document.getElementById("bar-pitch-select").value;
        if (!size && !type && !gauge && !pitch) {
          history.replaceState(null, "", "#bar");
          return;
        }
        const parts = [];
        if (size) parts.push(`s=${encodeURIComponent(size)}`);
        if (type) parts.push(`t=${encodeURIComponent(type)}`);
        if (gauge) parts.push(`g=${encodeURIComponent(gauge)}`);
        if (pitch) parts.push(`p=${encodeURIComponent(pitch)}`);
        history.replaceState(null, "", `#bar/${parts.join("&")}`);
      }

      function renderBarResults(bars) {
        const container = document.getElementById("results");

        if (bars.length === 0) {
          container.innerHTML =
            '<p class="empty-state">No bars match the current filters.</p>';
          return;
        }

        if (bars.length > 50) {
          container.innerHTML = `<p class="empty-state">Showing all ${bars.length} bars. Use the filters to narrow down.</p>`;
          // Still render them, just show a count header
        }

        // Sort: by size (numeric), then bar type, then gauge
        bars.sort((a, b) => {
          const sA = parseFloat(a.size),
            sB = parseFloat(b.size);
          if (sA !== sB) return sA - sB;
          if (a.barType !== b.barType)
            return a.barType.localeCompare(b.barType);
          return a.gauge.localeCompare(b.gauge);
        });

        // Figure out which chain types are present across all filtered bars
        const usedTypes = CHAIN_TYPES.filter((t) =>
          bars.some((b) => b.chains[t]),
        );

        let html = `<div class="bar-results-grid">`;

        for (const bar of bars) {
          const barUsedTypes = usedTypes.filter((t) => bar.chains[t]);

          const autoOpen = bars.length === 1 ? " open" : "";
          html += `<div class="bar-result-card${autoOpen}">`;

          // Bar specs row (clickable toggle)
          html += `<div class="bar-specs" onclick="this.parentElement.classList.toggle('open')">`;
          html += `<div class="bar-spec"><span class="bar-spec-label">Size</span><span class="bar-spec-value">${bar.size}</span></div>`;
          html += `<div class="bar-spec"><span class="bar-spec-label">Type</span><span class="bar-spec-value">${bar.barType}</span></div>`;
          html += `<div class="bar-spec"><span class="bar-spec-label">Pitch</span><span class="bar-spec-value">${bar.pitch}</span></div>`;
          html += `<div class="bar-spec"><span class="bar-spec-label">Gauge</span><span class="bar-spec-value">${bar.gauge}</span></div>`;
          html += `<div class="bar-spec"><span class="bar-spec-label">Drive Links</span><span class="bar-spec-value">${bar.dl != null ? bar.dl : "–"}</span></div>`;
          const mfrLabel =
            bar.brand === "stihl"
              ? "STIHL"
              : bar.brand === "stihl discontinued"
                ? "STIHL (disc.)"
                : bar.brand === "cannon"
                  ? "Cannon"
                  : bar.brand === "oregon"
                    ? "Oregon"
                    : bar.brand || "";
          html += `<div class="bar-spec"><span class="bar-spec-label">Manufacturer</span><span class="bar-spec-value">${mfrLabel}</span></div>`;
          html += `<div class="bar-spec"><span class="bar-spec-label">Part Number</span><span class="bar-spec-value">${bar.pn} <button class="copy-btn" onclick="event.stopPropagation();copyPN('${bar.pn}',this)">copy</button></span></div>`;
          html += `<div class="bar-toggle"></div>`;
          html += `</div>`;

          // Collapsible detail section
          html += `<div class="bar-detail">`;

          // Compatible chains
          if (barUsedTypes.length) {
            html += `<div class="bar-section-title">Compatible Chains</div>`;
            html += `<table class="compat-table"><thead><tr>`;
            for (const t of barUsedTypes) {
              html += `<th class="chain-cell">${CHAIN_LABELS[t].replace("\n", "<br>")}</th>`;
            }
            html += `</tr></thead><tbody><tr>`;
            for (const t of barUsedTypes) {
              const c = bar.chains[t];
              html += `<td class="chain-cell has">${c || "–"}</td>`;
            }
            html += `</tr></tbody></table>`;
          }

          // Compatible saws
          if (bar.saws.length) {
            html += `<div class="bar-section-title">Fits These Chainsaws</div>`;
            html += `<div class="saw-list">`;
            html += bar.saws
              .map((s) => {
                const brandLabel =
                  s.brand === "stihl"
                    ? "STIHL"
                    : s.brand === "stihl discontinued"
                      ? "STIHL (disc.)"
                      : s.brand === "cannon"
                        ? "Cannon"
                        : s.brand === "oregon"
                          ? "Oregon"
                          : s.brand;
                return `<a class="saw-link" onclick="jumpToSaw('${s.brand}','${s.model}')">${brandLabel} ${s.model}</a>`;
              })
              .join(", ");
            html += `</div>`;
          }

          html += `</div>`; // .bar-detail
          html += `</div>`; // .bar-result-card
        }

        html += `</div>`;
        container.innerHTML = html;
      }

      function jumpToSaw(brand, model) {
        switchView("saw");
        document.getElementById("brand-select").value = brand;
        onBrandChange();
        document.getElementById("model-input").value = model;
        onModelChange();
      }

      function jumpToBar(pn) {
        switchView("bar");
        document.getElementById("bar-size-select").value = "";
        document.getElementById("bar-type-select").value = "";
        document.getElementById("bar-gauge-select").value = "";
        document.getElementById("bar-pitch-select").value = "";
        document.getElementById("bar-pn-input").value = pn;
        const bar = BAR_INDEX[pn];
        if (bar) {
          renderBarResults([bar]);
          history.replaceState(null, "", `#bar/pn/${encodeURIComponent(pn)}`);
        }
      }

      // ─── Init ──────────────────────────────────────────────────────────────────────

      function init() {
        // Always populate the model dropdown regardless of which view loads
        document.getElementById("brand-select").value = "stihl";
        onBrandChange();

        const hash = decodeURIComponent(location.hash.slice(1));

        if (hash.startsWith("bar")) {
          // Bar view
          switchView("bar");

          if (hash.startsWith("bar/pn/")) {
            // Specific PN
            const pn = hash.slice(7);
            if (BAR_INDEX[pn]) {
              document.getElementById("bar-pn-input").value = pn;
              renderBarResults([BAR_INDEX[pn]]);
            }
          } else if (hash.includes("=")) {
            // Filters
            const params = hash.replace("bar/", "").split("&");
            for (const p of params) {
              const [k, v] = p.split("=");
              const val = decodeURIComponent(v);
              if (k === "s")
                document.getElementById("bar-size-select").value = val;
              if (k === "t")
                document.getElementById("bar-type-select").value = val;
              if (k === "g")
                document.getElementById("bar-gauge-select").value = val;
              if (k === "p")
                document.getElementById("bar-pitch-select").value = val;
            }
            onBarFilterChange();
          } else {
            // Just "bar" with no filters — show empty state
            document.getElementById("results").innerHTML =
              '<p class="empty-state">Use the filters or search a part number to find bars.</p>';
          }
        } else {
          // Saw view (default)
          // Handle legacy hashes without "saw/" prefix
          let brand, model;
          if (hash.startsWith("saw/")) {
            const rest = hash.slice(4); // remove "saw/"
            const idx = rest.indexOf("/");
            brand = idx >= 0 ? rest.slice(0, idx) : rest;
            model = idx >= 0 ? rest.slice(idx + 1) : undefined;
          } else if (hash.includes("/")) {
            const idx = hash.indexOf("/");
            brand = hash.slice(0, idx);
            model = hash.slice(idx + 1);
          }

          if (brand && MODELS[brand]) {
            document.getElementById("brand-select").value = brand;
            onBrandChange();
            if (model && MODELS[brand][model]) {
              document.getElementById("model-input").value = model;
              onModelChange();
            }
          }
        }
      }

      // ─── Load data and initialize ─────────────────────────────────────────────────
      document.getElementById("results").innerHTML =
        '<p class="empty-state">Loading data...</p>';

      fetch("stihl-data.json")
        .then((r) => {
          if (!r.ok) throw new Error("Failed to load data: " + r.status);
          return r.json();
        })
        .then((data) => {
          CHAIN_TYPES = data.chainTypes;
          CHAIN_LABELS = data.chainLabels;
          MODELS = data.models;
          CANNON = data.cannon || null;
          OREGON = data.oregon || null;
          OREGON_CHAINS = data.oregonChains || null;
          buildBarIndex();
          init();
        })
        .catch((err) => {
          console.error(err);
          document.getElementById("results").innerHTML =
            '<p class="empty-state" style="color:#e55;">Failed to load compatibility data. ' +
            "Make sure stihl-data.json is in the same directory.</p>";
        });
    </script>
  </body>
</html>
