      * {

        padding: 0;
      }
      body {

          -apple-system,
          sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        min-height: 100vh;
        padding: 1rem;
      }
      @media (min-width: 600px) {
        body {
          padding: 2rem;
        }
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 600;
        color: #f5a623;
        margin-bottom: 0.25rem;
      }
      .subtitle {
        font-size: 0.85rem;
        color: #888;
        margin-bottom: 1.5rem;
      }
      .subtitle a {
        color: #f5a623;
        text-decoration: none;
      }
      .controls {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
        align-items: flex-end;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      .field label {
        font-size: 0.78rem;
        color: #aaa;
      }
      select {
        background: #252525;
        border: 1px solid #444;
        border-radius: 5px;
        color: #e0e0e0;
        padding: 0.5rem 0.6rem;
        font-size: 0.9rem;
        min-width: 200px;
        outline: none;
      }
      select:focus {
        border-color: #f5a623;
      }

      .panel {
        background: #252525;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 1.25rem;
        margin-bottom: 1rem;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .panel h2 {
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        margin-bottom: 0.75rem;
      }

      .size-header {
        font-size: 0.85rem;
        font-weight: 700;
        color: #f5a623;
        background: #1e1e1e;
        padding: 0.5rem 0.6rem;
        border-bottom: 2px solid #f5a623;
        margin-top: 1rem;
      }
      .size-header:first-child {
        margin-top: 0;
      }

      .compat-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.75rem;
        table-layout: auto;
      }
      .compat-table th {
        text-align: left;
        padding: 0.3rem 0.5rem;
        background: #2e2e2e;
        color: #888;
        font-weight: 600;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        border-bottom: 1px solid #444;
        white-space: nowrap;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      .compat-table td {
        padding: 0.3rem 0.5rem;
        border-bottom: 1px solid #2a2a2a;
        white-space: nowrap;
        vertical-align: middle;
      }
      .compat-table tr:hover td {
        background: #2a2a2a;
      }
      .compat-table .bar-info {
        color: #ccc;
        font-weight: 500;
      }
      .compat-table .bar-pn {
        color: #e0e0e0;
        font-size: 0.7rem;
      }
      .compat-table .chain-cell {
        text-align: center;
        color: #888;
        font-size: 0.72rem;
      }
      .compat-table .chain-cell.has {
        color: #ccc;
      }
      .compat-table .chain-cell .code {
        display: block;
      }

      .rec {
        position: relative;
      }
      .rec::after {
        content: "\2605";
        color: #f5a623;
        font-size: 0.6rem;
        position: absolute;
        top: -2px;
        right: -1px;
      }

      .rec-row td {
        background: #1e2a1e !important;
      }
      .rec-row:hover td {
        background: #243a24 !important;
      }

      .legend {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
        font-size: 0.75rem;
        color: #888;
        margin-bottom: 1rem;
        align-items: center;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }
      .legend-star {
        color: #f5a623;
      }

      .sprocket-info {
        font-size: 0.8rem;
        color: #888;
        margin-top: 0.5rem;
      }
      .sprocket-info span {
        color: #ccc;
      }

      .empty-state {
        color: #555;
        text-align: center;
        padding: 3rem 1rem;
        font-size: 0.9rem;
      }
    </style>
  </head>

      // ─── UI ────────────────────────────────────────────────────────────────────────

      function onBrandChange() {
        const brand = document.getElementById("brand-select").value;
        const modelSel = document.getElementById("model-select");
        modelSel.innerHTML = '<option value="">Select model...</option>';
        if (brand && MODELS[brand]) {
          for (const m of Object.keys(MODELS[brand])) {
            modelSel.innerHTML += `<option value="${m}">${m}</option>`;
          }
        }
        document.getElementById("results").innerHTML =
          '<p class="empty-state">Select your chainsaw model above to see compatible bars and chains.</p>';
      }

      function onModelChange() {
        const brand = document.getElementById("brand-select").value;
        const model = document.getElementById("model-select").value;
        if (!brand || !model) {
          document.getElementById("results").innerHTML =
            '<p class="empty-state">Select your chainsaw model above.</p>';
          return;
        }
        renderModel(model, MODELS[brand][model]);
      }

      function renderModel(name, data) {
        const container = document.getElementById("results");

        // Figure out which chain types are actually used
        const usedTypes = CHAIN_TYPES.filter((t) =>
          data.rows.some((r) => r.chains[t]),
        );

        // Group rows by size
        const sizes = [];
        const sizeMap = {};
        for (const row of data.rows) {
          if (!sizeMap[row.size]) {
            sizeMap[row.size] = [];
            sizes.push(row.size);
          }
          sizeMap[row.size].push(row);
        }

        let html = "";
        html += `<div class="legend">`;
        html += `<span style="color:#aaa;font-weight:600;">${name}</span>`;
        html += `<span class="legend-item"><span class="legend-star">&#9733;</span> Stihl recommended</span>`;
        html += `</div>`;

        // Sprocket table
        const sprs = data.sprockets || (data.sprocket ? [data.sprocket] : []);
        if (sprs.length) {
          html += `<div class="panel"><h2>Sprocket Options</h2>`;
          html += `<table class="compat-table"><thead><tr><th>Pitch</th><th>Teeth</th><th>Spur Sprocket</th><th>Rim Sprocket</th><th>Rim &amp; Drum Kit</th></tr></thead><tbody>`;
          for (const s of sprs) {
            html += `<tr>`;
            html += `<td class="bar-info">${s.pitch}</td>`;
            html += `<td class="bar-info">${s.teeth}</td>`;
            html += `<td class="bar-pn">${s.spur || "–"}</td>`;
            html += `<td class="bar-pn">${s.rim}</td>`;
            html += `<td class="bar-pn">${s.rimKit}</td>`;
            html += `</tr>`;
          }
          html += `</tbody></table></div>`;
        }

        html += `<div class="panel">`;

        for (const size of sizes) {
          const rows = sizeMap[size];
          html += `<div class="size-header">${size}</div>`;
          html += `<table class="compat-table">`;
          html += `<thead><tr>`;
          html += `<th>Bar Type</th><th>Pitch</th><th>Gauge</th><th>DL</th><th>Bar P/N</th>`;
          for (const t of usedTypes) {
            html += `<th class="chain-cell">${CHAIN_LABELS[t].replace("\n", "<br>")}</th>`;
          }
          html += `</tr></thead><tbody>`;

          // Calculate rowspans for bar type + pitch groups
          const groups = [];
          for (let i = 0; i < rows.length; i++) {
            const key = rows[i].barType + "|" + rows[i].pitch;
            if (groups.length && groups[groups.length - 1].key === key) {
              groups[groups.length - 1].count++;
            } else {
              groups.push({ key, start: i, count: 1 });
            }
          }
          const rowspanAt = {};
          for (const g of groups) {
            rowspanAt[g.start] = g.count;
          }

          for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            const cls = "";
            const barPNs = row.barPN.split("\n");
            const hasRec = rows
              .slice(i, i + (rowspanAt[i] || 0))
              .some((r) => r.rec);
            html += `<tr${cls}>`;
            if (rowspanAt[i]) {
              const span = rowspanAt[i] > 1 ? ` rowspan="${rowspanAt[i]}"` : "";
              html += `<td class="bar-info"${span} style="vertical-align:middle;border-right:1px solid #333;">${row.barType}</td>`;
              html += `<td class="bar-info"${span} style="vertical-align:middle;">${row.pitch}</td>`;
            }
            html += `<td class="bar-info">${row.gauge}</td>`;
            html += `<td class="bar-info">${row.dl}</td>`;
            html += `<td class="bar-pn">${barPNs.join("<br>")}${row.rec ? ' <span style="color:#f5a623">&#9733;</span>' : ""}</td>`;
            for (const t of usedTypes) {
              const c = row.chains[t];
              html += `<td class="chain-cell ${c ? "has" : ""}">${c || "–"}</td>`;
            }
            html += `</tr>`;
          }
          html += `</tbody></table>`;
        }

        html += `</div>`;
        container.innerHTML = html;
      }

      // Init
      document.getElementById("brand-select").value = "stihl";
      onBrandChange();
    </script>
