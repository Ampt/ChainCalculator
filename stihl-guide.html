<html lang="en">

      * {

        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        min-height: 100vh;
        padding: 1rem;
      }
      @media (min-width: 600px) {
        body {
          padding: 2rem;
        }
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 600;
        color: #f5a623;
        margin-bottom: 0.25rem;
      }
      .subtitle {
        font-size: 0.85rem;
        color: #888;
        margin-bottom: 1.5rem;
      }
      .subtitle a {
        color: #f5a623;
        text-decoration: none;
      }
      .controls {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
        align-items: flex-end;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      .field label {
        font-size: 0.78rem;
        color: #aaa;
      }
      select {
        background: #252525;
        border: 1px solid #444;
        border-radius: 5px;
        color: #e0e0e0;
        padding: 0.5rem 0.6rem;
        font-size: 0.9rem;
        min-width: 200px;
        outline: none;
      }
      select:focus {
        border-color: #f5a623;
      }

      .panel {
        background: #252525;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 1.25rem;
        margin-bottom: 1rem;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .panel h2 {
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        margin-bottom: 0.75rem;
      }

      .size-header {
        font-size: 0.85rem;
        font-weight: 700;
        color: #f5a623;
        background: #1e1e1e !important;
        padding: 0.5rem 0.6rem;
        border-bottom: 2px solid #f5a623 !important;
      }

      .compat-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.75rem;
        table-layout: auto;
      }
      .compat-table th {
        text-align: left;
        padding: 0.3rem 0.5rem;
        background: #2e2e2e;
        color: #888;
        font-weight: 600;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        border-bottom: 1px solid #444;
        white-space: nowrap;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      .compat-table td {
        padding: 0.3rem 0.5rem;
        border-bottom: 1px solid #2a2a2a;
        white-space: nowrap;
        vertical-align: middle;
      }
      .compat-table tr:hover td {
        background: #2a2a2a;
      }
      .compat-table .bar-info {
        color: #ccc;
        font-weight: 500;
      }
      .compat-table .bar-pn {
        color: #e0e0e0;
        font-size: 0.7rem;
      }
      .compat-table .chain-cell {
        text-align: center;
        color: #888;
        font-size: 0.72rem;
      }
      .compat-table .chain-cell.has {
        color: #ccc;
      }
      .compat-table .chain-cell .code {
        display: block;
      }

      .rec {
        position: relative;
      }
      .rec::after {
        content: "\2605";
        color: #f5a623;
        font-size: 0.6rem;
        position: absolute;
        top: -2px;
        right: -1px;
      }

      .rec-row td {
        background: #1e2a1e !important;
      }
      .rec-row:hover td {
        background: #243a24 !important;
      }

      .legend {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
        font-size: 0.75rem;
        color: #888;
        margin-bottom: 1rem;
        align-items: center;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }
      .legend-star {
        color: #f5a623;
      }

      .sprocket-info {
        font-size: 0.8rem;
        color: #888;
        margin-top: 0.5rem;
      }
      .sprocket-info span {
        color: #ccc;
      }

      .empty-state {
        color: #555;
        text-align: center;
        padding: 3rem 1rem;
        font-size: 0.9rem;
      }

      /* View toggle */
      .view-toggle {
        display: flex;
        gap: 0;
        margin-bottom: 1.25rem;
        border: 1px solid #444;
        border-radius: 6px;
        overflow: hidden;
        width: fit-content;
      }
      .toggle-btn {
        background: #252525;
        border: none;
        color: #888;
        padding: 0.5rem 1.25rem;
        font-size: 0.85rem;
        cursor: pointer;
        font-weight: 500;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .toggle-btn:not(:last-child) {
        border-right: 1px solid #444;
      }
      .toggle-btn:hover {
        color: #ccc;
        background: #2e2e2e;
      }
      .toggle-btn.active {
        background: #f5a623;
        color: #1a1a1a;
        font-weight: 600;
      }

      /* Bar PN search */
      .bar-pn-field {
        position: relative;
      }
      .bar-pn-field input {
        background: #252525;
        border: 1px solid #444;
        border-radius: 5px;
        color: #e0e0e0;
        padding: 0.5rem 0.6rem;
        font-size: 0.9rem;
        min-width: 200px;
        outline: none;
        font-family: inherit;
      }
      .bar-pn-field input:focus {
        border-color: #f5a623;
      }
      .pn-dropdown {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: #2a2a2a;
        border: 1px solid #444;
        border-top: none;
        border-radius: 0 0 5px 5px;
        max-height: 200px;
        overflow-y: auto;
        z-index: 10;
      }
      .pn-dropdown.open {
        display: block;
      }
      .pn-option {
        padding: 0.4rem 0.6rem;
        font-size: 0.8rem;
        color: #ccc;
        cursor: pointer;
      }
      .pn-option:hover {
        background: #383838;
        color: #f5a623;
      }
      .pn-option .pn-meta {
        color: #666;
        font-size: 0.7rem;
        margin-left: 0.5rem;
      }

      /* Bar results */

        border: 1px solid #333;
        border-radius: 8px;
        padding: 1.25rem;
        margin-bottom: 1rem;
        overflow-x: auto;
      }

        display: grid;
        grid-template-columns: 3.5rem 10rem 3.5rem 3.5rem 4rem 9rem auto;
        gap: 0.75rem;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }
      .bar-specs:hover {
        background: #2a2a2a;
        margin: -0.5rem;
        padding: 0.5rem;
        border-radius: 4px;
      }
      .bar-result-card.open .bar-specs {
        margin-bottom: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid #333;
      }

        .bar-specs {
          grid-template-columns: repeat(3, 1fr);
          gap: 0.5rem;
        }

        align-items: center;
        color: #555;
        font-size: 0.75rem;
        margin-left: auto;
        padding-left: 1rem;
        flex-shrink: 0;
      }
      .bar-toggle::after {
        content: "\25B6";
        font-size: 0.6rem;
        transition: transform 0.15s;
      }
      .bar-result-card.open .bar-toggle::after {
        transform: rotate(90deg);
      }
      .bar-detail {
        display: none;
      }
      .bar-result-card.open .bar-detail {
        display: block;
      }

        display: flex;
        flex-direction: column;
      }

        letter-spacing: 0.03em;
        color: #666;

        font-size: 0.95rem;
        color: #e0e0e0;
        font-weight: 500;
      }

        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        margin: 1rem 0 0.5rem 0;

      .saw-list-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.78rem;
      }
      .saw-list-table th {
        text-align: left;
        padding: 0.3rem 0.5rem;
        background: #2e2e2e;
        color: #888;
        font-weight: 600;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        border-bottom: 1px solid #444;

        border-bottom: 1px solid #2a2a2a;
        color: #ccc;
      }
      .saw-list-table tr:hover td {
        background: #2a2a2a;
      }

        font-size: 0.82rem;
        color: #ccc;
        line-height: 1.6;
      }
      .saw-link {
        color: #f5a623;
        text-decoration: none;
        cursor: pointer;
      }
      .saw-link:hover {
        text-decoration: underline;
      }
      .copy-btn {
        background: none;
        border: 1px solid #444;
        border-radius: 3px;
        color: #888;
        font-size: 0.6rem;
        padding: 1px 4px;
        margin-left: 4px;
        cursor: pointer;
        vertical-align: middle;
        line-height: 1;
      }
      .copy-btn:hover {
        border-color: #f5a623;
        color: #f5a623;
      }
      .copy-btn.copied {
        border-color: #4a4;
        color: #4a4;
      }

        display: grid;
        gap: 1rem;
      }

        color: #555;
        font-size: 0.85rem;
        padding: 1rem 0;
      }

  <body>
    <h1>Stihl Chain &amp; Bar Compatibility Guide</h1>
    <p class="subtitle">
      Look up by chainsaw or by bar &nbsp;|&nbsp;
      <a href="index.html">Back to Chain Calculator</a>
    </p>

    <div class="view-toggle">
      <button
        class="toggle-btn active"
        data-view="saw"
        onclick="switchView('saw')"
      >
        By Chainsaw
      </button>
      <button class="toggle-btn" data-view="bar" onclick="switchView('bar')">
        By Bar
      </button>
    </div>

    <div id="saw-controls" class="controls">
      <div class="field">
        <label>Brand</label>
        <select id="brand-select" onchange="onBrandChange()">
          <option value="">Select brand...</option>
          <option value="stihl" selected>STIHL</option>
        </select>
      </div>
      <div class="field">
        <label>Model</label>
        <select id="model-select" onchange="onModelChange()">
          <option value="">Select model...</option>
        </select>
      </div>
    </div>

    <div id="bar-controls" class="controls" style="display: none">
      <div class="field">
        <label>Bar Size</label>
        <select id="bar-size-select" onchange="onBarFilterChange()">
          <option value="">All sizes...</option>
        </select>
      </div>
      <div class="field">
        <label>Bar Type</label>
        <select id="bar-type-select" onchange="onBarFilterChange()">
          <option value="">All types...</option>
        </select>
      </div>
      <div class="field">
        <label>Gauge</label>
        <select id="bar-gauge-select" onchange="onBarFilterChange()">
          <option value="">All gauges...</option>
        </select>
      </div>
      <div class="field">
        <label>Pitch</label>
        <select id="bar-pitch-select" onchange="onBarFilterChange()">
          <option value="">All pitches...</option>
        </select>
      </div>
      <div class="field bar-pn-field">
        <label>Part Number</label>
        <input
          type="text"
          id="bar-pn-input"
          placeholder="Search P/N..."
          oninput="onBarPNInput()"
          autocomplete="off"
        />
        <div id="bar-pn-dropdown" class="pn-dropdown"></div>
      </div>
    </div>

    <div id="results">
      <p class="empty-state">
        Select your chainsaw model above to see compatible bars and chains.
      </p>
    </div>

                barPN: "3005 000 7409",
                rec: false,
                chains: {
                  PM3: "63 PM3 50",
                  PS3: "63 PS3 50",
                  PD3: "63 PD3 50",
                  PM: "63 PM 50",
                  PS: "63 PS 50",
                },
              },
              {
                size: '16"',
                barType: "Rollomatic E Light",
                pitch: '3/8" P',
                gauge: ".050",
                dl: 55,
                barPN: "3005 000 7413",
                rec: false,
                chains: {
                  PM3: "63 PM3 55",
                  PS3: "63 PS3 55",
                  PD3: "63 PD3 55",
                  PM: "63 PM 55",
                  PS: "63 PS 55",
                },
              },
            ],
          },
        },
      };

      // ─── Helpers ────────────────────────────────────────────────────────────────────
      function escAttr(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function copyPN(pn, btn) {
        navigator.clipboard.writeText(pn).then(() => {
          btn.textContent = "✓";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.textContent = "copy";
            btn.classList.remove("copied");
          }, 1200);
        });
      }

      // ─── Bar Index (computed from MODELS) ─────────────────────────────────────────
      // Key = bar PN, value = { barType, size, pitch, gauge, dl, chains, saws: [{brand, model, rec}] }
      const BAR_INDEX = {};
      (function buildBarIndex() {
        for (const brand of Object.keys(MODELS)) {
          for (const model of Object.keys(MODELS[brand])) {
            const data = MODELS[brand][model];
            for (const row of data.rows) {
              const pns = row.barPN.split("\n");
              for (const pn of pns) {
                const key = pn.trim();
                if (!BAR_INDEX[key]) {
                  BAR_INDEX[key] = {
                    pn: key,
                    barType: row.barType,
                    size: row.size,
                    pitch: row.pitch,
                    gauge: row.gauge,
                    dl: row.dl,
                    chains: { ...row.chains },
                    saws: [],
                  };
                } else {
                  // Merge chains (same bar may have different chain avail listed per model)
                  for (const [ct, cv] of Object.entries(row.chains)) {
                    if (!BAR_INDEX[key].chains[ct])
                      BAR_INDEX[key].chains[ct] = cv;
                  }
                }
                // Add saw reference
                const already = BAR_INDEX[key].saws.find(
                  (s) => s.brand === brand && s.model === model,
                );
                if (!already) {
                  BAR_INDEX[key].saws.push({ brand, model, rec: row.rec });
                }
              }
            }
          }
        }
      })();

      // Sorted list of all unique bar PNs
      const ALL_BAR_PNS = Object.keys(BAR_INDEX).sort();

      // ─── UI ────────────────────────────────────────────────────────────────────────

      let currentView = "saw"; // "saw" or "bar"

      function switchView(view) {
        currentView = view;
        document.querySelectorAll(".toggle-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.view === view);
        });
        document.getElementById("saw-controls").style.display =
          view === "saw" ? "flex" : "none";
        document.getElementById("bar-controls").style.display =
          view === "bar" ? "flex" : "none";

        if (view === "saw") {
          onModelChange();
        } else {
          populateBarFilters();
          onBarFilterChange();
        }
      }

      // ─── Saw View ──────────────────────────────────────────────────────────────────

      function onBrandChange() {
        const brand = document.getElementById("brand-select").value;
        const modelSel = document.getElementById("model-select");
        modelSel.innerHTML = '<option value="">Select model...</option>';
        if (brand && MODELS[brand]) {
          for (const m of Object.keys(MODELS[brand])) {
            modelSel.innerHTML += `<option value="${m}">${m}</option>`;
          }
        }
        document.getElementById("results").innerHTML =
          '<p class="empty-state">Select your chainsaw model above to see compatible bars and chains.</p>';
      }

      function onModelChange() {
        const brand = document.getElementById("brand-select").value;
        const model = document.getElementById("model-select").value;
        if (!brand || !model) {
          document.getElementById("results").innerHTML =
            '<p class="empty-state">Select your chainsaw model above to see compatible bars and chains.</p>';
          if (currentView === "saw")
            history.replaceState(null, "", location.pathname);
          return;
        }
        if (currentView === "saw") {
          history.replaceState(
            null,
            "",
            `#saw/${encodeURIComponent(brand)}/${encodeURIComponent(model)}`,
          );
        }
        renderModel(model, MODELS[brand][model]);
      }

      function renderModel(name, data) {
        const container = document.getElementById("results");

        // Figure out which chain types are actually used
        const usedTypes = CHAIN_TYPES.filter((t) =>
          data.rows.some((r) => r.chains[t]),
        );

        // Group rows by size, sorted numerically
        const sizeMap = {};
        for (const row of data.rows) {
          if (!sizeMap[row.size]) sizeMap[row.size] = [];
          sizeMap[row.size].push(row);
        }
        const sizes = Object.keys(sizeMap).sort(
          (a, b) => parseFloat(a) - parseFloat(b),
        );

        let html = "";
        html += `<div class="legend">`;
        html += `<span style="color:#aaa;font-weight:600;">${name}</span>`;
        html += `<span class="legend-item"><span class="legend-star">&#9733;</span> Stihl recommended</span>`;
        html += `</div>`;

        // Sprocket table
        const sprs = data.sprockets || (data.sprocket ? [data.sprocket] : []);
        if (sprs.length) {
          html += `<div class="panel"><h2>Sprocket Options</h2>`;
          html += `<table class="compat-table"><thead><tr><th>Pitch</th><th>Teeth</th><th>Spur Sprocket</th><th>Rim Sprocket</th><th>Rim &amp; Drum Kit</th></tr></thead><tbody>`;
          for (const s of sprs) {
            html += `<tr>`;
            html += `<td class="bar-info">${s.pitch}</td>`;
            html += `<td class="bar-info">${s.teeth}</td>`;
            html += `<td class="bar-pn">${s.spur ? s.spur + ` <button class="copy-btn" onclick="copyPN('${s.spur}',this)">copy</button>` : "–"}</td>`;
            html += `<td class="bar-pn">${s.rim ? s.rim + ` <button class="copy-btn" onclick="copyPN('${s.rim}',this)">copy</button>` : "–"}</td>`;
            html += `<td class="bar-pn">${s.rimKit ? s.rimKit + ` <button class="copy-btn" onclick="copyPN('${s.rimKit}',this)">copy</button>` : "–"}</td>`;
            html += `</tr>`;
          }
          html += `</tbody></table></div>`;
        }

        const totalCols = 5 + usedTypes.length;

        html += `<div class="panel">`;
        html += `<table class="compat-table"><tbody>`;

        for (const size of sizes) {
          const rows = sizeMap[size];

          // Header row with size as first column
          html += `<tr>`;
          html += `<th class="size-header" style="text-align:left;">${size}</th>`;
          html += `<th class="size-header">Pitch</th><th class="size-header">Gauge</th><th class="size-header">DL</th><th class="size-header">Bar P/N</th>`;
          for (const t of usedTypes) {
            html += `<th class="size-header chain-cell">${CHAIN_LABELS[t].replace("\n", "<br>")}</th>`;
          }
          html += `</tr>`;

          // Calculate rowspans for bar type + pitch groups
          const groups = [];
          for (let i = 0; i < rows.length; i++) {
            const key = rows[i].barType + "|" + rows[i].pitch;
            if (groups.length && groups[groups.length - 1].key === key) {
              groups[groups.length - 1].count++;
            } else {
              groups.push({ key, start: i, count: 1 });
            }
          }
          const rowspanAt = {};
          for (const g of groups) {
            rowspanAt[g.start] = g.count;
          }

          for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            const barPNs = row.barPN.split("\n");
            html += `<tr>`;
            if (rowspanAt[i]) {
              const span = rowspanAt[i] > 1 ? ` rowspan="${rowspanAt[i]}"` : "";
              html += `<td class="bar-info"${span} style="vertical-align:middle;border-right:1px solid #333;">${row.barType}</td>`;
              html += `<td class="bar-info"${span} style="vertical-align:middle;">${row.pitch}</td>`;
            }
            html += `<td class="bar-info">${row.gauge}</td>`;
            html += `<td class="bar-info">${row.dl}</td>`;
            const pnLinks = barPNs
              .map((pn) => {
                const p = pn.trim();
                return `<a class="saw-link" onclick="jumpToBar('${p}')">${p}</a><button class="copy-btn" onclick="event.stopPropagation();copyPN('${p}',this)">copy</button>`;
              })
              .join("<br>");
            html += `<td class="bar-pn">${pnLinks}${row.rec ? ' <span style="color:#f5a623">&#9733;</span>' : ""}</td>`;
            for (const t of usedTypes) {
              const c = row.chains[t];
              html += `<td class="chain-cell ${c ? "has" : ""}">${c || "–"}</td>`;
            }
            html += `</tr>`;
          }
        }

        html += `</tbody></table>`;
        html += `</div>`;
        container.innerHTML = html;
      }

      // ─── Bar View ──────────────────────────────────────────────────────────────────

      function populateBarFilters() {
        const sizeSel = document.getElementById("bar-size-select");
        const typeSel = document.getElementById("bar-type-select");
        const gaugeSel = document.getElementById("bar-gauge-select");
        const pitchSel = document.getElementById("bar-pitch-select");

        const sizes = [...new Set(Object.values(BAR_INDEX).map((b) => b.size))];
        const types = [
          ...new Set(Object.values(BAR_INDEX).map((b) => b.barType)),
        ];
        const gauges = [
          ...new Set(Object.values(BAR_INDEX).map((b) => b.gauge)),
        ];
        const pitches = [
          ...new Set(Object.values(BAR_INDEX).map((b) => b.pitch)),
        ];

        // Sort sizes numerically
        sizes.sort((a, b) => parseFloat(a) - parseFloat(b));
        types.sort();
        gauges.sort();
        pitches.sort();

        function fill(sel, opts) {
          const val = sel.value;
          const label = sel.options[0].text;
          sel.innerHTML = `<option value="">${label}</option>`;
          for (const o of opts)
            sel.innerHTML += `<option value="${escAttr(o)}">${o}</option>`;
          if (opts.includes(val)) sel.value = val;
        }

        fill(sizeSel, sizes);
        fill(typeSel, types);
        fill(gaugeSel, gauges);
        fill(pitchSel, pitches);
      }

      function getFilteredBars() {
        const size = document.getElementById("bar-size-select").value;
        const type = document.getElementById("bar-type-select").value;
        const gauge = document.getElementById("bar-gauge-select").value;
        const pitch = document.getElementById("bar-pitch-select").value;

        return Object.values(BAR_INDEX).filter((b) => {
          if (size && b.size !== size) return false;
          if (type && b.barType !== type) return false;
          if (gauge && b.gauge !== gauge) return false;
          if (pitch && b.pitch !== pitch) return false;
          return true;
        });
      }

      function onBarFilterChange() {
        // Clear PN input when filters change
        document.getElementById("bar-pn-input").value = "";
        closePNDropdown();

        const bars = getFilteredBars();
        updateBarFilterOptions(bars);
        renderBarResults(bars);
        updateBarHash();
      }

      function updateBarFilterOptions(matchingBars) {
        // Update each filter to only show options that exist in the current result set,
        // but preserve the user's current selections
        const sizeSel = document.getElementById("bar-size-select");
        const typeSel = document.getElementById("bar-type-select");
        const gaugeSel = document.getElementById("bar-gauge-select");
        const pitchSel = document.getElementById("bar-pitch-select");

        // For each filter, determine available options by relaxing just that filter
        function optionsFor(field) {
          const size = sizeSel.value;
          const type = typeSel.value;
          const gauge = gaugeSel.value;
          const pitch = pitchSel.value;
          const vals = new Set();
          for (const b of Object.values(BAR_INDEX)) {
            if (field !== "size" && size && b.size !== size) continue;
            if (field !== "type" && type && b.barType !== type) continue;
            if (field !== "gauge" && gauge && b.gauge !== gauge) continue;
            if (field !== "pitch" && pitch && b.pitch !== pitch) continue;
            vals.add(b[field === "type" ? "barType" : field]);
          }
          return vals;
        }

        function updateOpts(sel, opts, sort) {
          const val = sel.value;
          const label = sel.options[0].text;
          const sorted = [...opts];
          if (sort === "num")
            sorted.sort((a, b) => parseFloat(a) - parseFloat(b));
          else sorted.sort();
          sel.innerHTML = `<option value="">${label}</option>`;
          for (const o of sorted)
            sel.innerHTML += `<option value="${escAttr(o)}">${o}</option>`;
          if (opts.has(val)) sel.value = val;
          else sel.value = "";
        }

        updateOpts(sizeSel, optionsFor("size"), "num");
        updateOpts(typeSel, optionsFor("type"), "str");
        updateOpts(gaugeSel, optionsFor("gauge"), "str");
        updateOpts(pitchSel, optionsFor("pitch"), "str");
      }

      function onBarPNInput() {
        const input = document.getElementById("bar-pn-input");
        const dropdown = document.getElementById("bar-pn-dropdown");
        const query = input.value.trim().replace(/\s+/g, "");

        if (query.length < 2) {
          closePNDropdown();
          return;
        }

        // Search — match anywhere in the PN (ignoring spaces)
        const matches = ALL_BAR_PNS.filter((pn) =>
          pn.replace(/\s+/g, "").includes(query),
        ).slice(0, 15);

        if (matches.length === 0) {
          dropdown.innerHTML =
            '<div class="pn-option" style="color:#555;cursor:default;">No matches</div>';
          dropdown.classList.add("open");
          return;
        }

        dropdown.innerHTML = matches
          .map((pn) => {
            const b = BAR_INDEX[pn];
            return `<div class="pn-option" onclick="selectBarPN('${pn}')">${pn}<span class="pn-meta">${b.size} ${b.barType} ${b.pitch} ${b.gauge}</span></div>`;
          })
          .join("");
        dropdown.classList.add("open");
      }

      function selectBarPN(pn) {
        document.getElementById("bar-pn-input").value = pn;
        closePNDropdown();

        // Reset filters
        document.getElementById("bar-size-select").value = "";
        document.getElementById("bar-type-select").value = "";
        document.getElementById("bar-gauge-select").value = "";
        document.getElementById("bar-pitch-select").value = "";

        const bar = BAR_INDEX[pn];
        if (bar) {
          renderBarResults([bar]);
          history.replaceState(null, "", `#bar/pn/${encodeURIComponent(pn)}`);
        }
      }

      function closePNDropdown() {
        document.getElementById("bar-pn-dropdown").classList.remove("open");
      }

      // Close PN dropdown when clicking outside
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".bar-pn-field")) closePNDropdown();
      });

      function updateBarHash() {
        const size = document.getElementById("bar-size-select").value;
        const type = document.getElementById("bar-type-select").value;
        const gauge = document.getElementById("bar-gauge-select").value;
        const pitch = document.getElementById("bar-pitch-select").value;
        if (!size && !type && !gauge && !pitch) {
          history.replaceState(null, "", "#bar");
          return;
        }
        const parts = [];
        if (size) parts.push(`s=${encodeURIComponent(size)}`);
        if (type) parts.push(`t=${encodeURIComponent(type)}`);
        if (gauge) parts.push(`g=${encodeURIComponent(gauge)}`);
        if (pitch) parts.push(`p=${encodeURIComponent(pitch)}`);
        history.replaceState(null, "", `#bar/${parts.join("&")}`);
      }

      function renderBarResults(bars) {
        const container = document.getElementById("results");

        if (bars.length === 0) {
          container.innerHTML =
            '<p class="empty-state">No bars match the current filters.</p>';
          return;
        }

        if (bars.length > 50) {
          container.innerHTML = `<p class="empty-state">Showing all ${bars.length} bars. Use the filters to narrow down.</p>`;
          // Still render them, just show a count header
        }

        // Sort: by size (numeric), then bar type, then gauge
        bars.sort((a, b) => {
          const sA = parseFloat(a.size),
            sB = parseFloat(b.size);
          if (sA !== sB) return sA - sB;
          if (a.barType !== b.barType)
            return a.barType.localeCompare(b.barType);
          return a.gauge.localeCompare(b.gauge);
        });

        // Figure out which chain types are present across all filtered bars
        const usedTypes = CHAIN_TYPES.filter((t) =>
          bars.some((b) => b.chains[t]),
        );

        let html = `<div class="bar-results-grid">`;

        for (const bar of bars) {
          const barUsedTypes = usedTypes.filter((t) => bar.chains[t]);

          const autoOpen = bars.length === 1 ? " open" : "";
          html += `<div class="bar-result-card${autoOpen}">`;

          // Bar specs row (clickable toggle)
          html += `<div class="bar-specs" onclick="this.parentElement.classList.toggle('open')">`;
          html += `<div class="bar-spec"><span class="bar-spec-label">Size</span><span class="bar-spec-value">${bar.size}</span></div>`;
          html += `<div class="bar-spec"><span class="bar-spec-label">Type</span><span class="bar-spec-value">${bar.barType}</span></div>`;
          html += `<div class="bar-spec"><span class="bar-spec-label">Pitch</span><span class="bar-spec-value">${bar.pitch}</span></div>`;
          html += `<div class="bar-spec"><span class="bar-spec-label">Gauge</span><span class="bar-spec-value">${bar.gauge}</span></div>`;
          html += `<div class="bar-spec"><span class="bar-spec-label">Drive Links</span><span class="bar-spec-value">${bar.dl}</span></div>`;
          html += `<div class="bar-spec"><span class="bar-spec-label">Part Number</span><span class="bar-spec-value">${bar.pn} <button class="copy-btn" onclick="event.stopPropagation();copyPN('${bar.pn}',this)">copy</button></span></div>`;
          html += `<div class="bar-toggle"></div>`;
          html += `</div>`;

          // Collapsible detail section
          html += `<div class="bar-detail">`;

          // Compatible chains
          if (barUsedTypes.length) {
            html += `<div class="bar-section-title">Compatible Chains</div>`;
            html += `<table class="compat-table"><thead><tr>`;
            for (const t of barUsedTypes) {
              html += `<th class="chain-cell">${CHAIN_LABELS[t].replace("\n", "<br>")}</th>`;
            }
            html += `</tr></thead><tbody><tr>`;
            for (const t of barUsedTypes) {
              const c = bar.chains[t];
              html += `<td class="chain-cell has">${c || "–"}</td>`;
            }
            html += `</tr></tbody></table>`;
          }

          // Compatible saws
          if (bar.saws.length) {
            html += `<div class="bar-section-title">Fits These Chainsaws</div>`;
            html += `<div class="saw-list">`;
            html += bar.saws
              .map((s) => {
                const brandLabel = s.brand === "stihl" ? "STIHL" : s.brand;
                return `<a class="saw-link" onclick="jumpToSaw('${s.brand}','${s.model}')">${brandLabel} ${s.model}</a>`;
              })
              .join(", ");
            html += `</div>`;
          }

          html += `</div>`; // .bar-detail
          html += `</div>`; // .bar-result-card
        }

        html += `</div>`;
        container.innerHTML = html;
      }

      function jumpToSaw(brand, model) {
        switchView("saw");
        document.getElementById("brand-select").value = brand;
        onBrandChange();
        document.getElementById("model-select").value = model;
        onModelChange();
      }

      function jumpToBar(pn) {
        switchView("bar");
        document.getElementById("bar-size-select").value = "";
        document.getElementById("bar-type-select").value = "";
        document.getElementById("bar-gauge-select").value = "";
        document.getElementById("bar-pitch-select").value = "";
        document.getElementById("bar-pn-input").value = pn;
        const bar = BAR_INDEX[pn];
        if (bar) {
          renderBarResults([bar]);
          history.replaceState(null, "", `#bar/pn/${encodeURIComponent(pn)}`);
        }
      }

      // ─── Init ──────────────────────────────────────────────────────────────────────

      (function init() {
        // Always populate the model dropdown regardless of which view loads
        document.getElementById("brand-select").value = "stihl";
        onBrandChange();

        const hash = decodeURIComponent(location.hash.slice(1));

        if (hash.startsWith("bar")) {
          // Bar view
          switchView("bar");

          if (hash.startsWith("bar/pn/")) {
            // Specific PN
            const pn = hash.slice(7);
            if (BAR_INDEX[pn]) {
              document.getElementById("bar-pn-input").value = pn;
              renderBarResults([BAR_INDEX[pn]]);
            }
          } else if (hash.includes("=")) {
            // Filters
            const params = hash.replace("bar/", "").split("&");
            for (const p of params) {
              const [k, v] = p.split("=");
              const val = decodeURIComponent(v);
              if (k === "s")
                document.getElementById("bar-size-select").value = val;
              if (k === "t")
                document.getElementById("bar-type-select").value = val;
              if (k === "g")
                document.getElementById("bar-gauge-select").value = val;
              if (k === "p")
                document.getElementById("bar-pitch-select").value = val;
            }
            onBarFilterChange();
          } else {
            // Just "bar" with no filters — show empty state
            document.getElementById("results").innerHTML =
              '<p class="empty-state">Use the filters or search a part number to find bars.</p>';
          }
        } else {
          // Saw view (default)
          // Handle legacy hashes without "saw/" prefix
          let brand, model;
          if (hash.startsWith("saw/")) {
            const rest = hash.slice(4); // remove "saw/"
            const idx = rest.indexOf("/");
            brand = idx >= 0 ? rest.slice(0, idx) : rest;
            model = idx >= 0 ? rest.slice(idx + 1) : undefined;
          } else if (hash.includes("/")) {
            const idx = hash.indexOf("/");
            brand = hash.slice(0, idx);
            model = hash.slice(idx + 1);
          }

          if (brand && MODELS[brand]) {
            document.getElementById("brand-select").value = brand;
            onBrandChange();
            if (model && MODELS[brand][model]) {
              document.getElementById("model-select").value = model;
              onModelChange();
            }
          }
        }
      })();
    </script>
  </body>
