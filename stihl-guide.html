      * {

        padding: 0;
      }
      body {

          sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        min-height: 100vh;
        padding: 1rem;
      }
      @media (min-width: 600px) {
        body {
          padding: 2rem;
        }
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 600;
        color: #f5a623;
        margin-bottom: 0.25rem;
      }
      .subtitle {
        font-size: 0.85rem;
        color: #888;
        margin-bottom: 1.5rem;
      }
      .subtitle a {
        color: #f5a623;
        text-decoration: none;
      }
      .subtitle a:hover {
        text-decoration: underline;
      }
      .controls {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
        align-items: flex-end;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      .field label {
        font-size: 0.78rem;
        color: #aaa;
      }
      select {
        background: #252525;
        border: 1px solid #444;
        border-radius: 5px;
        color: #e0e0e0;
        padding: 0.5rem 0.6rem;
        font-size: 0.9rem;
        min-width: 200px;
        outline: none;
      }
      select:focus {
        border-color: #f5a623;
      }

      .panel {
        background: #252525;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 1.25rem;
        margin-bottom: 1rem;
      }
      .panel h2 {
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        margin-bottom: 1rem;
      }

      .rec-badge {
        display: inline-block;
        background: #f5a623;
        color: #1a1a1a;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.15rem 0.4rem;
        border-radius: 3px;
        margin-left: 0.4rem;
        vertical-align: middle;
      }

      .bar-group {
        border: 1px solid #333;
        border-radius: 6px;
        margin-bottom: 0.75rem;
        overflow: hidden;
      }
      .bar-header {
        background: #2e2e2e;
        padding: 0.6rem 1rem;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        user-select: none;
      }
      .bar-header:hover {
        background: #363636;
      }
      .bar-header .bar-label {
        font-weight: 600;
        color: #e0e0e0;
      }
      .bar-header .bar-meta {
        color: #888;
        font-size: 0.78rem;
      }
      .bar-header .toggle {
        color: #666;
        font-size: 0.9rem;
        transition: transform 0.2s;
      }
      .bar-header .toggle.open {
        transform: rotate(90deg);
      }
      .bar-body {
        padding: 0.75rem 1rem;
        display: none;
      }
      .bar-body.open {
        display: block;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.2rem 1rem;
        font-size: 0.82rem;
        margin-bottom: 0.75rem;
      }
      .detail-grid .label {
        color: #888;
      }
      .detail-grid .value {
        color: #ccc;
        font-variant-numeric: tabular-nums;
      }

      .chain-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
      }
      .chain-table th {
        text-align: left;
        padding: 0.35rem 0.5rem;
        background: #1e1e1e;
        color: #888;
        font-weight: 600;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-bottom: 1px solid #333;
      }
      .chain-table td {
        padding: 0.35rem 0.5rem;
        border-bottom: 1px solid #2a2a2a;
        color: #ccc;
      }
      .chain-table tr:last-child td {
        border-bottom: none;
      }
      .chain-table tr:hover td {
        background: #2a2a2a;
      }
      .chain-table .pn {
        font-variant-numeric: tabular-nums;
        color: #999;
        font-size: 0.75rem;
      }

      .sprocket-info {
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 0.75rem 1rem;
        margin-top: 1rem;
        font-size: 0.82rem;
      }
      .sprocket-info h3 {
        font-size: 0.8rem;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 0.5rem;
      }

      .empty-state {
        color: #555;
        text-align: center;
        padding: 3rem 1rem;
        font-size: 0.9rem;
      }

      #chain-table-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>

      // ─── UI ────────────────────────────────────────────────────────────────────────

      function onBrandChange() {
        const brand = document.getElementById("brand-select").value;
        const modelSel = document.getElementById("model-select");
        modelSel.innerHTML = '<option value="">Select model...</option>';
        if (brand && MODELS[brand]) {
          for (const m of Object.keys(MODELS[brand])) {
            modelSel.innerHTML += `<option value="${m}">${m}</option>`;
          }
        }
        document.getElementById("results").innerHTML =
          '<p class="empty-state">Select your chainsaw model above to see compatible bars and chains.</p>';
      }

      function onModelChange() {
        const brand = document.getElementById("brand-select").value;
        const model = document.getElementById("model-select").value;
        if (!brand || !model) {
          document.getElementById("results").innerHTML =
            '<p class="empty-state">Select your chainsaw model above to see compatible bars and chains.</p>';
          return;
        }
        const data = MODELS[brand]?.[model];
        if (!data) return;
        renderModel(model, data);
      }

      function renderModel(name, data) {
        const container = document.getElementById("results");
        let html = "";

        // Recommended combos
        html += `<div class="panel"><h2>Recommended Combinations for ${name}</h2>`;
        for (const rec of data.recommended) {
          html += `<div class="bar-group">`;
          html += `<div class="bar-header" style="cursor:default;">`;
          html += `<span class="bar-label">${rec.barLen} — ${rec.barType} <span class="rec-badge">RECOMMENDED</span></span>`;
          html += `<span class="bar-meta">${rec.pitch} pitch &nbsp;|&nbsp; ${rec.gauge}mm gauge &nbsp;|&nbsp; ${rec.dl} DL</span>`;
          html += `</div>`;
          html += `<div class="bar-body open">`;
          html += `<div class="detail-grid"><span class="label">Bar P/N:</span><span class="value">${rec.barPN}</span></div>`;
          html += `<div id="chain-table-container"><table class="chain-table"><thead><tr><th>Chain Type</th><th>Chain Code</th><th>Part Number</th></tr></thead><tbody>`;
          for (const c of rec.chains) {
            html += `<tr><td>${c.type}</td><td>${c.code}</td><td class="pn">${c.pn}</td></tr>`;
          }
          html += `</tbody></table></div></div></div>`;
        }
        html += `</div>`;

        // All compatible bars grouped by bar type
        const barTypes = [...new Set(data.bars.map((b) => b.barType))];
        html += `<div class="panel"><h2>All Compatible Combinations</h2>`;
        for (const bt of barTypes) {
          html += `<h3 style="font-size:0.82rem;color:#666;text-transform:uppercase;letter-spacing:0.04em;margin:1rem 0 0.5rem;border-bottom:1px solid #333;padding-bottom:0.3rem;">${bt}</h3>`;
          const barsOfType = data.bars.filter((b) => b.barType === bt);
          for (const bar of barsOfType) {
            const dlStr = Array.isArray(bar.dl) ? bar.dl.join(" or ") : bar.dl;
            const pnStr = Array.isArray(bar.barPN)
              ? bar.barPN.join(", ")
              : bar.barPN;
            const id = `bar-${Math.random().toString(36).slice(2, 8)}`;
            html += `<div class="bar-group">`;
            html += `<div class="bar-header" onclick="toggleBar('${id}')">`;
            html += `<span class="bar-label">${bar.barLen}</span>`;
            html += `<span class="bar-meta">${bar.pitch} &nbsp;|&nbsp; ${bar.gauge}mm &nbsp;|&nbsp; ${dlStr} DL &nbsp;&nbsp;<span class="toggle" id="tog-${id}">&#9654;</span></span>`;
            html += `</div>`;
            html += `<div class="bar-body" id="${id}">`;
            html += `<div class="detail-grid">`;
            html += `<span class="label">Bar P/N:</span><span class="value">${pnStr}</span>`;
            html += `<span class="label">Pitch:</span><span class="value">${bar.pitch}</span>`;
            html += `<span class="label">Gauge:</span><span class="value">${bar.gauge}mm</span>`;
            html += `<span class="label">Drive Links:</span><span class="value">${dlStr}</span>`;
            html += `</div>`;
            html += `<div id="chain-table-container"><table class="chain-table"><thead><tr><th>Chain Type</th><th>Chain Code</th></tr></thead><tbody>`;
            for (const c of bar.chains) {
              html += `<tr><td>${c.type}</td><td>${c.code}</td></tr>`;
            }
            html += `</tbody></table></div></div></div>`;
          }
        }
        html += `</div>`;

        // Sprocket
        if (data.sprocket) {
          html += `<div class="sprocket-info"><h3>Sprocket Information</h3>`;
          html += `<div class="detail-grid">`;
          html += `<span class="label">Chain Pitch:</span><span class="value">${data.sprocket.pitch}</span>`;
          html += `<span class="label">Spur Sprocket P/N:</span><span class="value">${data.sprocket.spur.pn}</span>`;
          html += `<span class="label">Teeth:</span><span class="value">${data.sprocket.spur.teeth}</span>`;
          html += `</div></div>`;
        }

        container.innerHTML = html;
      }

      function toggleBar(id) {
        const body = document.getElementById(id);
        const tog = document.getElementById("tog-" + id);
        body.classList.toggle("open");
        tog.classList.toggle("open");
      }

      // Init
      onBrandChange();
      document.getElementById("brand-select").value = "stihl";
      onBrandChange();
    </script>
